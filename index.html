<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identitas Staff - PT. Media Tulisan Manusia</title>
    
    <link rel="icon" type="image/png" href="logopt.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Script Parser Excel/CSV ke Web -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    animation: {
                        blob: "blob 7s infinite",
                        'fade-up': 'fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards'
                    },
                    keyframes: {
                        blob: {
                            "0%, 100%": { transform: "translate(0px, 0px) scale(1)" },
                            "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                            "66%": { transform: "translate(-20px, 20px) scale(0.9)" }
                        },
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { transition: background-color 0.5s ease, color 0.5s ease; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
        .glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.65) 0%, rgba(245, 245, 250, 0.4) 100%);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.1);
        }
        .dark .glass {
            background: linear-gradient(135deg, rgba(25, 25, 28, 0.6) 0%, rgba(10, 10, 12, 0.4) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 15px 40px -5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-[#050505] text-gray-900 dark:text-white min-h-screen flex flex-col items-center justify-center relative overflow-hidden px-4 py-10">

    <div class="fixed inset-0 w-full h-full z-[-1] pointer-events-none flex justify-center items-center overflow-hidden">
        <div class="absolute top-[10%] left-[10%] md:left-[30%] w-64 h-64 md:w-96 md:h-96 bg-gray-300 dark:bg-gray-800 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-70 animate-blob transition-colors duration-700"></div>
        <div class="absolute top-[20%] right-[10%] md:right-[30%] w-64 h-64 md:w-96 md:h-96 bg-gray-400 dark:bg-gray-900 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-70 animate-blob animation-delay-2000 transition-colors duration-700"></div>
        <div class="absolute bottom-[10%] left-[20%] md:left-[40%] w-64 h-64 md:w-96 md:h-96 bg-gray-200 dark:bg-gray-700 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-70 animate-blob animation-delay-4000 transition-colors duration-700"></div>
    </div>

    <button onclick="toggleTema()" class="absolute top-6 right-6 p-3 rounded-full glass hover:scale-110 transition-transform z-50 text-gray-800 dark:text-gray-200">
        <svg class="w-5 h-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
        <svg class="w-5 h-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
    </button>

    <div id="profil-staf" class="hidden w-full max-w-sm md:max-w-md glass rounded-[2.5rem] p-8 sm:p-10 md:p-12 relative text-center animate-fade-up z-10 border-t border-l border-white/40 dark:border-white/10">
        <img src="logopt.png" alt="Logo PT Media Tulisan Manusia" class="h-16 sm:h-20 w-auto object-contain mx-auto mb-8 drop-shadow-md dark:brightness-150 transition-all">

        <div class="relative w-32 h-32 md:w-36 md:h-36 mx-auto mb-6 group">
            <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-gray-300 to-gray-100 dark:from-gray-700 dark:to-gray-900 shadow-inner animate-pulse"></div>
            <img id="foto" src="" alt="Foto Staf" class="relative w-full h-full object-cover rounded-full border-[3px] border-white dark:border-gray-800 shadow-xl group-hover:scale-105 transition-transform duration-300 z-10 bg-white dark:bg-gray-800">
            <div class="absolute bottom-1 right-1 bg-blue-500 text-white p-1.5 rounded-full border-2 border-white dark:border-gray-800 z-20 shadow-md">
                <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
            </div>
        </div>

        <h1 id="nama" class="text-xl sm:text-2xl md:text-3xl font-black text-gray-900 dark:text-white tracking-tight leading-tight mb-2">Memuat...</h1>
        <p id="posisi" class="text-xs sm:text-sm font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-8">Memuat...</p>

        <div class="space-y-3 w-full">
            <a id="link-website" href="#" target="_blank" class="flex items-center justify-center gap-2 w-full bg-blue-600/10 dark:bg-blue-400/10 border border-blue-500/30 text-blue-700 dark:text-blue-300 font-extrabold py-3.5 px-4 rounded-2xl hover:bg-blue-600/20 dark:hover:bg-blue-400/20 transition-colors duration-300 text-xs sm:text-sm uppercase tracking-wider">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg> Website Profil
            </a>

            <a id="link-wa" href="#" target="_blank" class="flex items-center justify-center gap-2 w-full bg-gray-900 dark:bg-white text-white dark:text-gray-900 font-extrabold py-3.5 px-4 rounded-2xl shadow-lg hover:-translate-y-1 transition-transform duration-300 text-xs sm:text-sm uppercase tracking-wider">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347M12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0z"/></svg> WhatsApp
            </a>

            <a id="link-email" href="#" class="flex items-center justify-center gap-2 w-full bg-white/50 dark:bg-black/40 border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-white font-bold py-3.5 px-4 rounded-2xl hover:bg-white dark:hover:bg-black transition-colors duration-300 text-xs sm:text-sm tracking-wider">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg> Kirim Email
            </a>
        </div>

        <div class="mt-8 border-t border-gray-300 dark:border-gray-700 pt-5">
            <p class="text-[9px] sm:text-[10px] text-gray-500 uppercase tracking-widest font-bold">&copy; 2026 PT. Media Tulisan Manusia</p>
        </div>
    </div>

    <!-- Tampilan Error (Jika ID tidak ada di URL) -->
    <div id="error-staf" class="hidden text-center glass p-10 max-w-sm rounded-[2rem] z-10">
        <svg class="w-12 h-12 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-2">Akses Ditolak</h2>
        <p class="text-xs text-gray-600 dark:text-gray-400 font-medium leading-relaxed">Data staf tidak ditemukan atau URL QR Code tidak valid.</p>
    </div>

    <!-- SCRIPT LOGIKA PENGAMBILAN DATA GOOGLE SHEETS -->
    <script>
        // Set Default Tema
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        }
        function toggleTema() {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        }

        // Link CSV Langsung dari Google Sheets Anda
        const linkGoogleSheetCSV = "https://docs.google.com/spreadsheets/d/1Kz8fxegOpf_T28BNHpa6RYOET4rKDZvNeRTusl86PfU/export?format=csv";
        
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const idStaf = urlParams.get('id');

            if (!idStaf) {
                document.getElementById('error-staf').classList.remove('hidden');
                return;
            }

            // Membaca data langsung dari Google Sheets
            Papa.parse(linkGoogleSheetCSV, {
                download: true,
                header: true,
                complete: function(results) {
                    const dataArray = results.data;
                    
                    // Mencari baris yang ID-nya cocok dengan URL
                    const stafDitemukan = dataArray.find(row => row.ID == idStaf);

                    if (stafDitemukan && stafDitemukan.Nama) {
                        document.getElementById('nama').innerText = stafDitemukan.Nama;
                        document.getElementById('posisi').innerText = stafDitemukan.Posisi;
                        
                        // Konversi WA Otomatis (Membersihkan spasi/tanda hubung/merubah 0 menjadi 62)
                        let waNumber = stafDitemukan.WhatsApp.replace(/\D/g, ''); 
                        if(waNumber.startsWith('0')) { waNumber = '62' + waNumber.substring(1); }

                        document.getElementById('link-wa').href = "https://wa.me/" + waNumber;
                        document.getElementById('link-email').href = "mailto:" + stafDitemukan.Email;
                        
                        // Logika Website Otomatis
                        const namaLengkap = stafDitemukan.Nama.toLowerCase();
                        const btnWebsite = document.getElementById('link-website');
                        
                        if (namaLengkap.includes("sufyan wahyudi")) {
                            btnWebsite.href = "https://sufyan.mediatulisanmanusia.online";
                        } else {
                            btnWebsite.href = "https://mediatulisanmanusia.online";
                        }
                        
                        // Logika Auto Foto -> Mengambil nama file foto[ID].png di folder GitHub Anda
                        const imgFoto = document.getElementById('foto');
                        imgFoto.src = "foto" + idStaf + ".png"; // Cth: foto20261.png
                        imgFoto.onerror = function() {
                            this.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='%23ccc' viewBox='0 0 24 24'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";
                        };

                        document.getElementById('profil-staf').classList.remove('hidden');
                    } else {
                        document.getElementById('error-staf').classList.remove('hidden');
                    }
                },
                error: function(error) {
                    document.getElementById('error-staf').classList.remove('hidden');
                }
            });
        });
    </script>
</body>
</html>
